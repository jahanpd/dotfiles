# You have to change this based on your monitor
monitor=DP-2,5120x1440@60,0x0,1

# nvidia setup
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
cursor {
    no_hardware_cursors = true
}

# Status bar :)
# exec-once=eww open bar
exec-once=waybar

#Notification
exec-once=dunst

# Wallpaper
# exec-once=swaybg -o \* -i ~/.config/hypr/wallpapers/night.jpg -m fill
exec-once=swww-daemon
exec-once=swww img ~/.config/hypr/wallpapers/one.jpg

# For screen sharing
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Bluetooth
exec-once=blueman-applet # Make sure you have installed blueman

# Screen off on idle 
exec-once=swayidle -w timeout 1800 "hyprctl dispatch dpms off"

# Screen Sharing
# exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# exec-once=~/.config/hypr/scripts/screensharing.sh

input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
				tap-to-click = false
				clickfinger_behavior = true
    }

    sensitivity = 0.1 # for mouse cursor
    force_no_accel = false
		accel_profile = "adaptive"
}

gestures {
		gesture = 3, horizontal, workspace
}

# See https://wiki.hyprland.org/Configuring/Variables/
general {
    layout=dwindle

    gaps_in=5
    gaps_out=20
    border_size=0
    col.active_border=0xff5e81ac
    col.inactive_border=0x66333333

}

decoration {
    rounding=0
		active_opacity=1
		inactive_opacity=0.75
    blur {
        enabled=1
        size=6
        passes=2
        new_optimizations = true

        # Your blur "amount" is size * passes, but high size (over around 5-ish)
        # will produce artifacts.
        # if you want heavy blur, you need to up the passes.
        # the more passes, the more you can up the size without noticing artifacts.
    }
}

blurls=waybar
blurls=lockscreen

animations {
    enabled=1
    # bezier=overshot,0.05,0.9,0.1,1.1
    bezier=overshot,0.13,0.99,0.29,1.1
    animation=windows,1,4,overshot,popin
    animation=fade,1,10,default
    animation=workspaces,1,6,overshot,slide
    animation=border,1,10,default
}

dwindle {
    pseudotile=1 # enable pseudotiling on dwindle
    # force_split=2
    force_split=0
}

master {
    new_on_top=true
}

misc {
    disable_hyprland_logo=true
    disable_splash_rendering=true
    mouse_move_enables_dpms=true
    vfr = false
}
# sources
source = ~/.config/hypr/keybindings.conf
